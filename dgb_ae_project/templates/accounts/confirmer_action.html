{% extends "base_app.html" %}
{% load i18n %}
{% block titre %}{{ titre }}{% endblock %}
{% block contenu %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="carte-dgb p-4 p-md-5 text-center">
      <i class="bi bi-exclamation-triangle display-4 {% if danger %}text-danger{% else %}texte-dore{% endif %}"></i>
      <h4 class="mt-3">{{ titre }}</h4>
      <p class="text-muted">{{ message }}</p>
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn {% if danger %}btn-danger{% else %}btn-vert-dore{% endif %}">{% trans "Confirmer" %}</button>
        <a href="{% url url_retour %}" class="btn btn-outline-secondary">{% trans "Annuler" %}</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
